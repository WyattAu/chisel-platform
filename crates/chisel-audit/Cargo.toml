[package]
name = "chisel-audit"
description = "Platform side of Chisel Docs: identity, assets, and the tamper-evident document audit trail: composed from the WyattAu kit estate"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tamper-audit.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# test-only: #[tokio::test] needs a runtime; the library itself is
# runtime-agnostic (async fns run on the caller's executor), which also
# keeps tokio out of the wasm32 graph (its multi-thread runtime does not
# compile there).
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
